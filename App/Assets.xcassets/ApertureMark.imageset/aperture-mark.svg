<!-- Aperture brand mark — the abstract "aperture" glyph (an S-curve with
     three nodes) isolated from the full brand logo. Fill uses currentColor so
     it inherits text color / tint. Geometry extracted from the aperture chat
     UI's logo-light.svg / logo-dark.svg (the unmasked solid paths). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" role="img" aria-label="Aperture" fill="currentColor">
  <!-- Upper curve: top-right down to the lower-left bend -->
  <path d="M126,54c9.94,0,18,8.06,18,18,0,39.69-31.12,71.97-69.37,71.97H18c-9.94,0-18-8.06-18-18s8.06-18,18-18h56.63c18.4,0,33.37-16.14,33.37-35.97,0-9.94,8.06-18,18-18Z"/>
  <!-- Lower curve: lower-left up to the top-right bend -->
  <path d="M18,89.97c-9.94,0-18-8.06-18-18C0,32.29,31.12,0,69.37,0h56.63C135.94,0,144,8.06,144,18s-8.06,18-18,18h-56.63c-18.4,0-33.37,16.14-33.37,35.97,0,9.94-8.06,18-18,18Z"/>
  <!-- Three nodes along the diagonal -->
  <path d="M18,143.97c9.94,0,18-8.06,18-18s-8.06-18-18-18S0,116.03,0,125.97s8.06,18,18,18Z"/>
  <path d="M72,90c9.94,0,18-8.06,18-18s-8.06-18-18-18-18,8.06-18,18,8.06,18,18,18Z"/>
  <path d="M126,36c9.94,0,18-8.06,18-18S135.94,0,126,0s-18,8.06-18,18,8.06,18,18,18Z"/>
</svg>
